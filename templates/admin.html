<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Amar Bangladesh</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="narrow"><a href="/dashboard">← Dashboard</a><section class="panel"><h1>অ্যাডমিন প্যানেল</h1><p>নতুন তথ্য যোগ করলে তা প্রকাশিত হবে। কেবল যাচাই করা তথ্য ও নির্ভরযোগ্য উৎস ব্যবহার করুন।</p><form method="post" action="/admin/notices"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><label>শিরোনাম (বাংলা)<input name="title_bn" required></label><label>Title (English)<input name="title_en" required></label><label>বিবরণ (বাংলা)<textarea name="body_bn" required></textarea></label><label>Description (English)<textarea name="body_en" required></textarea></label><label>বিভাগ<input name="category" required></label><label>উৎস URL (ঐচ্ছিক)<input type="url" name="source_url"></label><button>প্রকাশ করুন</button></form></section><section class="panel"><h2>সব নোটিশ</h2>{% for n in notices %}<div class="notice"><strong>{{ n.title_bn }}</strong> · {% if n.published %}প্রকাশিত{% else %}অপ্রকাশিত{% endif %}<form method="post" action="/admin/notices/{{ n.id }}/toggle"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><button class="secondary">প্রকাশের অবস্থা বদলান</button></form></div>{% else %}<p>কোনো নোটিশ নেই।</p>{% endfor %}</section></main></body></html>
